# Ecosystem-ci smoke test: this fork has no PR CI.
# Delete this workflow when upstream adds a pull_request workflow.
name: ecosystem-ci build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false
          run-install: false
      - name: vp install
        run: vp install --no-frozen-lockfile
      - name: vp build
        run: |
          cp apps/sigle/.env.development apps/sigle/.env.production.local
          cp apps/custom-domain/.env.development apps/custom-domain/.env.production.local
          vp run build
      - name: vp check
        run: vp check
