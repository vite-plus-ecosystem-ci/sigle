allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@reown/appkit": false
  "@sentry/cli": false
  "bigint-buffer": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "keccak": false
  msw: false
  "prisma": false
  "protobufjs": false
  "secp256k1": false
  "sharp": false
  "tiny-secp256k1": false
  "utf-8-validate": false
minimumReleaseAge: 1440 # 1 day
packages:
  - apps/*
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
  vitest: 5.0.3
  vite-plus: 0.0.0-commit.7cb75b46f7a73413ee0803eaac3f6a6b6763f158
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - sign-in-with-stacks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - effect
  - "@effect/*"
