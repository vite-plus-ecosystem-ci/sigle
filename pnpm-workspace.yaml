allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": true
  "@reown/appkit": false
  "@sentry/cli": false
  "bigint-buffer": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "keccak": false
  msw: false
  "prisma": false
  "protobufjs": false
  "secp256k1": false
  "sharp": false
  "tiny-secp256k1": false
  "utf-8-validate": false
minimumReleaseAge: 1440 # 1 day
packages:
  - apps/*
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
  vitest: 5.0.5
  vite-plus: 0.0.0-commit.6a30b43184ad1c159091d51d728ee8c249392aa1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - "@oxc-project/*"
  - tinybench
  - yuku-core
  - yuku-parser
  - "@yuku-core/*"
  - "@yuku-toolchain/*"
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - "@effect/tsgo"
  - sign-in-with-stacks
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - effect
  - "@effect/*"
